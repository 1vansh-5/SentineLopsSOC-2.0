# Replace .github/workflows/python-package.yml with this file.
# Restore the missing tests from the original source archive before running.
name: SentinelOps operational regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify source upload is complete
        shell: python
        run: |
          import json
          from pathlib import Path
          missing = [p for p in json.loads(Path('release-files.json').read_text(encoding='utf-8')) if not Path(p).is_file()]
          if missing:
              print('::error::Source upload is incomplete. Restore these files from the original source archive:')
              print('\n'.join(missing))
              raise SystemExit(1)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements-step9-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Install fixed test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Syntax and source credential exposure checks
        run: python manage.py hygiene check --node node
      - name: Run offline regression with three concurrency repetitions
        run: python manage.py checks --socket-free-http
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step12-results-${{ matrix.os }}
          path: |
            STEP12_TEST_RESULTS.json
            STEP12_TEST_RESULTS.txt
          if-no-files-found: warn
          retention-days: 14

